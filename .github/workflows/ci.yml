name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+" # dispara solo con tags como 1.0.6

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # necesario para crear releases y subir assets

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Cuando es un tag, sobreescribir FIRMWARE_VERSION en config.h con el
      # valor del tag antes de compilar, para que el binario tenga la versión
      # correcta sin depender de que el desarrollador la actualice a mano.
      - name: Patch FIRMWARE_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${{ github.ref_name }}
          sed -i "s/#define FIRMWARE_VERSION \".*\"/#define FIRMWARE_VERSION \"$VERSION\"/" include/config.h
          echo "FIRMWARE_VERSION parcheado a: $VERSION"
          grep FIRMWARE_VERSION include/config.h

      - name: Build firmware
        run: pio run

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: .pio/build/d1_mini/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
